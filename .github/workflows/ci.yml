name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run pipeline (generates outputs)
        run: dotnet run --project SauceDemoAutomation.Pipeline/SauceDemoAutomation.Pipeline.csproj --configuration Release
          # Upload test results
          - name: Upload Test Results
            uses: actions/upload-artifact@v3
            with:
              name: test-results
              path: Outputs/TestResults/
          # Upload LLM outputs
          - name: Upload LLM Outputs
            uses: actions/upload-artifact@v3
            with:
              name: llm-outputs
              path: Outputs/LlmOutputs/
# Run tests step removed – pipeline already runs tests
