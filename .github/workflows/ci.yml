name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest
    env:
      MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '8.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build solution
        run: dotnet build --configuration Release --no-restore

      - name: Run pipeline (generates outputs)
        run: dotnet run --project SauceDemoAutomation.Pipeline/SauceDemoAutomation.Pipeline.csproj --configuration Release

      - name: Run tests
        run: dotnet test SauceDemoAutomation.Pipeline/SauceDemoAutomation.Pipeline.csproj --configuration Release --no-build
